<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>測驗老師後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/quiz/common.css">
<script src="/quiz/prefs.js"></script>
<style>
  :root {
    --jade: #1f7a5a; --jade-soft: #e6f4ee;
    --sky: #2f6fb0; --sky-soft: #e8f1fa;
    --red-soft: #fbeae7;
    --r: 16px;
    --sh: 0 1px 2px rgba(27,42,65,.06), 0 8px 24px -12px rgba(27,42,65,.18);
  }
  :root[data-theme="dark"] {
    --jade: #4ade80; --jade-soft: rgba(34,197,94,.14);
    --sky: #7fb3f0; --sky-soft: rgba(59,130,246,.16);
    --red-soft: rgba(239,68,68,.14);
    --sh: 0 8px 24px -12px rgba(0,0,0,.6);
  }
  body { padding-bottom: 80px; }

  /* ---------- 頂部列 ---------- */
  .appbar { position: sticky; top: 0; z-index: 30; background: var(--tech-bar); color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .appbar::after, .stage-top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--tech-line); box-shadow: 0 0 12px rgba(0,229,255,.55); pointer-events: none; }
  .brand .t { background: var(--tech-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand img { filter: drop-shadow(0 0 8px rgba(0,229,255,.5)); }
  .appbar-in { max-width: 1240px; margin: 0 auto; padding: 0 20px; height: 60px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 900; font-size: 1.15rem; letter-spacing: .06em; white-space: nowrap; }
  .brand img { width: 36px; height: 36px; }
  .crumbs { color: #cbd5e1; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .crumbs b { color: #fff; font-weight: 500; }
  .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.25); color: #e2e8f0; border-radius: 10px; padding: 6px 12px; font-size: .85rem; }
  .btn-ghost:hover { background: rgba(255,255,255,.1); color: #fff; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 0; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); }
  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 0; flex-wrap: wrap; }
  .panel-h h2 { font-family: var(--serif); font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .panel-b { padding: 16px 20px 20px; }
  .ico { width: 30px; height: 30px; border-radius: 9px; display: inline-grid; place-items: center; font-size: .95rem; flex: none; }
  .ico.gold { background: var(--gold-soft); } .ico.sky { background: var(--sky-soft); }
  .ico.jade { background: var(--jade-soft); } .ico.red { background: var(--red-soft); }
  .btn { border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .btn-gold { background: linear-gradient(135deg, #d99a3a, #b97618); border: none; box-shadow: 0 6px 14px -6px rgba(185,118,24,.7); }
  .btn-gold:hover { filter: brightness(1.05); }
  .btn-soft { background: var(--card-2); border-color: var(--line); }
  .muted { color: var(--muted); font-size: .88rem; }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-weight: 700; letter-spacing: .12em; color: var(--gold); }

  /* ---------- 登入 ---------- */
  .login { max-width: 420px; margin: 8vh auto 0; text-align: center; padding: 34px 28px; }
  .login img { width: 72px; height: 72px; margin: 0 auto 14px; }
  .login h2 { font-family: var(--serif); font-size: 1.5rem; }
  .login p { color: var(--muted); margin: 6px 0 20px; font-size: .92rem; }
  .login .field { text-align: left; }
  .login .btn { width: 100%; margin-top: 14px; padding: 11px; }

  /* ---------- 派卷清單 ---------- */
  .list-layout { display: grid; grid-template-columns: 370px 1fr; gap: 22px; align-items: start; }
  .create { position: sticky; top: 84px; }
  .create .field { margin-top: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-toggles { display: grid; gap: 8px; margin-top: 6px; }
  .mode-toggle { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; background: var(--card-2); transition: .15s; }
  .mode-toggle input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--gold); flex: none; }
  .mode-toggle b { display: block; font-size: .93rem; }
  .mode-toggle small { color: var(--muted); font-size: .8rem; }
  .mode-toggle:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
  .create .btn-gold { width: 100%; margin-top: 16px; padding: 12px; font-size: 1rem; }
  .created { margin-top: 14px; border-radius: 12px; background: var(--jade-soft); border: 1px solid color-mix(in srgb, var(--jade) 35%, transparent); padding: 12px 14px; font-size: .9rem; }
  .assignment-qr { margin-top: 12px; text-align: center; }
  .assignment-qr img { display: block; width: 100%; max-width: 20rem; height: auto; margin: 0 auto 8px; }
  .assignment-qr .btn { text-decoration: none; }
  .qr-dialog { width: min(26rem, calc(100% - 24px)); max-width: none; max-height: calc(100% - 24px);
    padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); }
  .qr-dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .qr-dialog header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .qr-dialog h2 { margin: 0; font-size: 1.1rem; }
  .created .url { display: flex; gap: 6px; margin-top: 8px; }
  .created input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: .82rem; background: var(--input-bg); }

  .filters-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; font-size: .84rem; color: var(--text); }
  .chip-btn.active { background: var(--btn-primary); color: #fff; border-color: var(--btn-primary); }

  .a-list { display: grid; gap: 14px; }
  .a-card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px 22px; box-shadow: var(--sh); overflow: hidden; transition: transform .15s; }
  .a-card:hover { transform: translateY(-1px); }
  .a-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--muted); }
  .a-card.open::before { background: var(--jade); } .a-card.not_started::before { background: var(--sky); } .a-card.closed::before { background: #9b958a; }
  .a-top { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
  .a-title { font-family: var(--serif); font-size: 1.12rem; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-family: var(--f-sans); font-size: .72rem; border-radius: 99px; padding: 2px 9px; font-weight: 700; }
  .pill.open { background: var(--jade-soft); color: var(--jade); }
  .pill.closed { background: var(--chip-bg); color: var(--muted); }
  .pill.not_started { background: var(--sky-soft); color: var(--sky); }
  .a-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: .83rem; color: var(--muted); }
  .a-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .a-stats { display: flex; align-items: center; gap: 18px; }
  .stat-n { text-align: center; }
  .stat-n b { display: block; font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat-n span { font-size: .72rem; color: var(--muted); }
  .ring { --v: 0; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(closest-side, var(--card) 76%, transparent 78% 100%), conic-gradient(var(--gold) calc(var(--v) * 1%), var(--track) 0); }
  .ring b { font-size: 1rem; font-variant-numeric: tabular-nums; }
  .ring small { display: block; font-size: .6rem; color: var(--muted); margin-top: -3px; text-align: center; }
  .a-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .empty { text-align: center; padding: 40px 10px; color: var(--muted); }
  .empty .big { font-size: 2.4rem; }

  /* ---------- 報告 ---------- */
  .r-head { padding: 22px 22px 0; }
  .r-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .r-title { font-family: var(--serif); font-size: 1.55rem; font-weight: 900; line-height: 1.3; }
  .r-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .r-tools select, .sel { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--card); color: var(--text); }
  .tabs { display: flex; gap: 4px; margin-top: 18px; padding: 0 22px; border-bottom: 1px solid var(--line); }
  .tab { border: none; background: none; padding: 11px 16px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
  .tab.active { color: var(--text); border-bottom-color: var(--gold); }
  .tab-body { padding: 20px 22px 22px; }

  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .kpi { border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; background: var(--card-2); position: relative; overflow: hidden; }
  .kpi .ico { position: absolute; right: 10px; top: 10px; }
  .kpi span { font-size: .8rem; color: var(--muted); font-weight: 500; }
  .kpi b { display: block; font-size: 1.9rem; font-weight: 900; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi small { font-size: .78rem; color: var(--muted); }

  .score-chart { margin-top: 16px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 10px; }
  .score-chart h3 { font-size: .95rem; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .bars { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; align-items: end; height: 120px; }
  .bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; }
  .bar-col .n { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar-col .b { width: 100%; border-radius: 6px 6px 2px 2px; min-height: 2px; }
  .bar-col.fail .b { background: #e3a49b; } .bar-col.pass .b { background: #d9b26b; } .bar-col.high .b { background: #1f7a5a; }
  .bar-x { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 4px; }
  .bar-x span { font-size: .68rem; color: var(--muted); text-align: center; }

  .table-wrap { overflow-x: auto; margin-top: 16px; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 700px; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { background: var(--card-2); color: var(--muted); font-weight: 700; font-size: .82rem; cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--text); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.open-row { background: var(--gold-soft); }
  tr.detail-row { cursor: default; } tr.detail-row:hover { background: none; }
  tr.detail-row td { white-space: normal; background: var(--card-2); padding: 14px; }
  .score-badge { display: inline-block; min-width: 42px; text-align: center; border-radius: 8px; padding: 2px 8px; font-weight: 800; }
  .score-badge.s-high { background: var(--jade-soft); color: var(--jade); }
  .score-badge.s-mid { background: var(--gold-soft); color: var(--accent); }
  .score-badge.s-low { background: var(--red-soft); color: var(--wrong); }
  .flagnote { font-size: .75rem; border-radius: 6px; padding: 2px 7px; background: var(--gold-soft); color: var(--accent); margin-right: 4px; }
  .flagnote.prog { background: var(--sky-soft); color: var(--sky); }
  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 5px; }
  .mini { border-radius: 8px; text-align: center; font-size: .76rem; padding: 4px 0; border: 1px solid var(--line); background: var(--card); }
  .mini.ok { background: var(--correct-bg); color: var(--correct); }
  .mini.no { background: var(--wrong-bg); color: var(--wrong); }

  /* ---------- 試卷檢討 ---------- */
  .review-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .legend { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
  .legend-bar { width: 140px; height: 10px; border-radius: 99px; border: 1px solid var(--line); background: linear-gradient(90deg, #ffffff 0%, #fde047 50%, #dc2626 100%); }
  .btn-present { font-size: 1.02rem; padding: 10px 18px; }
  .heat-nav { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .heat-btn { width: 54px; height: 54px; border-radius: 10px; border: 1px solid rgba(0,0,0,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; transition: transform .1s; }
  .heat-btn:hover { transform: translateY(-2px); }
  .heat-btn b { font-size: 1rem; } .heat-btn small { font-size: .68rem; font-weight: 700; opacity: .9; }

  .opt .cnt { margin-left: auto; padding-left: 10px; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .opt .bar { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w, 0%); background: rgba(148,163,184,.22); transition: width .4s; z-index: 0; }
  .opt.correct-answer .bar { background: color-mix(in srgb, var(--correct) 22%, transparent); }
  .opt.correct-answer .cnt { color: var(--correct); }
  .opt.wrong-selected .bar { background: color-mix(in srgb, var(--wrong) 20%, transparent); }
  .opt.wrong-selected .cnt { color: var(--wrong); }
  .opt .note { font-size: .78em; font-weight: 700; margin-left: 8px; white-space: nowrap; }
  .rate-badge { font-size: .85em; border-radius: 99px; padding: 3px 12px; font-weight: 800; border: 1px solid rgba(0,0,0,.1); white-space: nowrap; }
  .blank-row { margin-top: 8px; font-size: .9em; color: var(--muted); }

  /* ---------- 投影檢討模式 ---------- */
  .stage { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
  .stage-top { position: relative; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--tech-bar); color: #fff; min-width: 0; }
  .stage-nav { min-width: 0; }
  .stage-top img { width: 34px; height: 34px; flex: none; }
  .stage-top .t { font-family: var(--serif); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
  .stage-nav { display: flex; gap: 5px; flex: 1; overflow-x: auto; padding: 2px; scrollbar-width: thin; }
  .stage-nav button { flex: none; width: 38px; height: 38px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); font-weight: 800; font-size: 15px; }
  .stage-nav button.cur { outline: 3px solid #fff; outline-offset: 1px; }
  .stage-body { overflow: hidden; padding: 1.2vh 3vw; display: flex; align-items: center; justify-content: center; }
  .stage-card { width: 100%; max-width: 1500px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 1.1em 1.4em; box-shadow: var(--shadow); font-size: calc(var(--fit, 28) * 1px); }
  .stage-card .q-head { font-size: .8em; }
  .stage-card .q-num { font-size: 1.15em; }
  .stage-card .q-tag { font-size: .8em; }
  .stage-card .q-title { font-size: 1.1em; margin: .5em 0 .6em; line-height: 1.6; }
  .stage-card .opt { font-size: 1em; padding: .45em .7em; margin-top: .4em; border-radius: .45em; line-height: 1.5; gap: .5em; border-width: 2px; }
  .stage-card .opt .letter { width: 1.45em; height: 1.45em; font-size: .9em; }
  .stage-card .exp { font-size: .78em; margin-top: .6em; line-height: 1.65; }
  .stage-card .blank-row { font-size: .75em; }
  .stage-bottom { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 16px; background: var(--card); border-top: 1px solid var(--border); flex-wrap: wrap; }
  .stage-bottom .btn { font-size: 17px; padding: 10px 18px; }
  .stage-bottom .pos { font-weight: 800; font-size: 18px; min-width: 80px; text-align: center; font-variant-numeric: tabular-nums; }
  .stage-bottom .btn.on { background: var(--btn-primary); color: #fff; border-color: var(--btn-primary); }
  .stage-hint { color: var(--muted); font-size: 13px; }

  @media (max-width: 1000px) {
    .list-layout { grid-template-columns: 1fr; }
    .create { position: static; }
    .kpis { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    .wrap { padding: 16px 16px 0; }
    .appbar-in { padding: 0 16px; }
    .brand span.t { display: none; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi b { font-size: 1.5rem; }
    .a-top { grid-template-columns: 1fr; }
    .a-stats { justify-content: space-around; }
    .r-head, .tab-body { padding-left: 16px; padding-right: 16px; }
    .tabs { padding: 0 10px; }
    .r-title { font-size: 1.25rem; }
    .bars { height: 90px; gap: 3px; } .bar-x { gap: 3px; }
    .heat-btn { width: 46px; height: 46px; }
    .stage-top .t, .stage-hint { display: none; }
    .stage-bottom .btn { font-size: 15px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<nav class="appbar">
  <div class="appbar-in">
    <div class="brand"><span class="logo-img quiz-mark" aria-hidden="true">卷</span><span class="t">測驗後台</span></div>
    <div class="crumbs" id="crumbs"></div>
    <button class="btn-ghost hidden" id="btnLogout">登出</button>
  </div>
</nav>

<main class="wrap">
  <!-- 登入 -->
  <section class="panel login hidden" id="loginCard">
    <span class="logo-img quiz-mark" aria-hidden="true">卷</span>
    <h2>老師登入</h2>
    <p>派卷、查看成績與試卷檢討</p>
    <div class="field"><label for="pw">老師密碼</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="btnLogin">登入</button>
    <div id="loginMsg"></div>
  </section>

  <!-- 派卷清單 -->
  <section id="listView" class="hidden">
    <div class="list-layout">
      <div class="panel create">
        <div class="panel-h"><h2><span class="ico gold">📤</span>派出新考卷</h2></div>
        <div class="panel-b">
          <div class="field" style="margin-top:0"><label for="fQuiz">試卷</label><select id="fQuiz"></select></div>
          <div class="field"><label for="fTitle">派卷名稱（可空白，預設用試卷名稱）</label><input id="fTitle" maxlength="60" placeholder="例：自然科練習"></div>
          <div class="two">
            <div class="field"><label for="fOpen">開放時間</label><input id="fOpen" type="datetime-local"></div>
            <div class="field"><label for="fClose">截止時間</label><input id="fClose" type="datetime-local"></div>
          </div>
          <div class="field">
            <label>允許的作答模式</label>
            <div class="mode-toggles">
              <label class="mode-toggle"><input type="checkbox" id="mInstant" value="instant" checked><span><b>每題作答即時核對</b><small>選完立刻看對錯與解析，適合自學</small></span></label>
              <label class="mode-toggle"><input type="checkbox" id="mFull" value="full" checked><span><b>全部做完再核對</b><small>交卷後才公布成績，適合正式測驗</small></span></label>
            </div>
          </div>
          <button class="btn btn-gold" id="btnCreate">📨 派出考卷</button>
          <div id="createMsg"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h">
          <h2><span class="ico sky">📚</span>已派出的考卷</h2>
          <div class="filters-row">
            <button class="chip-btn active" data-st="">全部</button>
            <button class="chip-btn" data-st="open">作答中</button>
            <button class="chip-btn" data-st="not_started">未開放</button>
            <button class="chip-btn" data-st="closed">已截止</button>
            <button class="chip-btn" id="btnReloadList" title="重新整理">⟳</button>
          </div>
        </div>
        <div class="panel-b"><div class="a-list" id="aList"></div></div>
      </div>
    </div>
  </section>

  <!-- 報告 -->
  <section id="reportView" class="hidden">
    <div class="panel">
      <div class="r-head">

<script>
(() => {
  const API = '/quiz/api/teacher';
  const L = ['A', 'B', 'C', 'D'];
  const MODE_NAME = { instant: '即時核對', full: '做完再核對' };
  const STATUS_NAME = { open: '作答中', closed: '已截止', not_started: '未開放' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = iso => iso ? new Date(iso).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
  const ss = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }

  let token = ss.get('quiz-teacher-token');
  let R = null;
  let sortKey = 'className', sortDir = 1;
  let openStudent = null;
  let allAssignments = [];
  let statusFilter = '';

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      method: opts.method || 'GET',
      headers: { ...(opts.body ? { 'content-type': 'application/json' } : {}), ...(token ? { authorization: `Bearer ${token}` } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.status === 401 && path !== '/login') { logout('登入已過期，請重新登入。'); throw new Error('請重新登入。'); }
    if (!res.ok) throw new Error(data.error || `連線錯誤（${res.status}）`);
    return data;
  }
  function toast(text) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }
  function show(view, crumbs = '') {
    ['loginCard', 'listView', 'reportView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
    $('btnLogout').classList.toggle('hidden', view === 'loginCard');
    $('crumbs').innerHTML = crumbs;
    window.scrollTo({ top: 0 });
  }

  // ---------- 登入 ----------
  $('btnLogin').onclick = async () => {
    $('loginMsg').innerHTML = '';
    $('btnLogin').disabled = true;
    try {
      const r = await api('/login', { method: 'POST', body: { password: $('pw').value } });
      token = r.token; ss.set('quiz-teacher-token', token); $('pw').value = '';
      openList();
    } catch (e) {
      $('loginMsg').innerHTML = `<div class="msg msg-err">${esc(e.message)}</div>`;
    } finally { $('btnLogin').disabled = false; }
  };
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });
  function logout(msg) {
    token = null; ss.set('quiz-teacher-token', null);
    closeStage();
    show('loginCard');
    $('loginMsg').innerHTML = msg ? `<div class="msg msg-warn">${esc(msg)}</div>` : '';
  }
  $('btnLogout').onclick = () => logout();

  // ---------- 派卷 ----------
  const localInput = d => {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  function resetTimes() {
    const now = new Date();
    const end = new Date(now); end.setHours(23, 59, 0, 0);
    $('fOpen').value = localInput(now);
    $('fClose').value = localInput(end);
  }

  async function openList() {
    show('listView', '<b>派卷與成績</b>');
    resetTimes();
    try {
      const { quizzes } = await api('/quizzes');
      const cur = $('fQuiz').value;
      $('fQuiz').innerHTML = quizzes.map(q => `<option value="${esc(q.id)}" data-title="${esc(q.title)}">${esc(q.title)}（${q.questionCount} 題）</option>`).join('');
      if (cur && quizzes.some(q => q.id === cur)) $('fQuiz').value = cur;
    } catch (e) { $('createMsg').innerHTML = `<div class="msg msg-err">${esc(e.message)}</div>`; }
    loadAssignments();
  }

  const studentUrl = code => `${location.origin}/quiz/?a=${code}`;

  function assignmentQr(code) {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(studentUrl(code));
      qr.make();
      const imageUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(qr.createSvgTag(8, 32));
      return `<div class="assignment-qr">
        <img src="${imageUrl}" alt="學生作答 QR Code（${esc(code)}）">
        <a class="btn btn-sm btn-soft" href="${imageUrl}" download="派卷-${esc(code)}.svg">下載 QR Code</a>
      </div>`;
    } catch {
      return '<p class="msg msg-warn">無法產生 QR Code，可複製學生網址分享。</p>';
    }
  }

  async function loadAssignments() {
    $('aList').innerHTML = '<div class="empty">載入中…</div>';
    try {
      allAssignments = (await api('/assignments')).assignments;
      renderAssignments();
    } catch (e) { $('aList').innerHTML = `<div class="msg msg-err">${esc(e.message)}</div>`; }
  }

  function renderAssignments() {

  function prepareReport() {
    const a = R.assignment;
    $('crumbs').innerHTML = `派卷與成績 › <b>${esc(a.title)}</b>`;
    $('rTitle').textContent = a.title;
    $('rMeta').innerHTML = `
      <span class="pill ${a.status}">${STATUS_NAME[a.status]}</span>
      <span>🔑 <span class="code">${a.code}</span></span><span>📘 ${esc(a.quizTitle)}</span>
      <span>🧭 ${a.modes.map(m => MODE_NAME[m]).join('・')}</span>
      ${a.closesAt ? `<span>⏰ 截止 ${fmt(a.closesAt)}</span>` : ''}`;

    const groups = new Map();
    for (const t of R.attempts) {
      const k = `${t.className}#${t.seat}`;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(t);
    }
    R.students = [];
    for (const list of groups.values()) {
      list.sort((x, y) => x.attemptNo - y.attemptNo);
      const first = list.find(x => x.attemptNo === 1) || list[0];
      const names = [...new Set(list.map(x => x.name))];
      R.students.push({
        ...first,
        duration: first.submittedAt ? (Date.parse(first.submittedAt) - Date.parse(first.startedAt)) / 1000 : null,
        extraAttempts: list.length - 1,
        otherNames: names.filter(n => n !== first.name),
        inProgress: !first.submittedAt
      });
    }
    const byName = new Map();
    R.students.forEach(s => byName.set(s.name, (byName.get(s.name) || 0) + 1));
    R.students.forEach(s => { s.dupName = byName.get(s.name) > 1; });

    const classes = [...new Set(R.students.map(s => s.className))].sort((x, y) => x.localeCompare(y, 'zh-Hant', { numeric: true }));
    $('classFilter').innerHTML = `<option value="">全部班級</option>` + classes.map(c => `<option value="${esc(c)}">${esc(c)} 班</option>`).join('');
    openStudent = null;
  }

  const selectedStudents = () => {
    const c = $('classFilter').value;

  $('classFilter').onchange = () => { openStudent = null; renderReport(); };

  function renderReport() { renderScores(); renderItems(); if (!$('stage').classList.contains('hidden')) renderStage(); }

  function fmtDur(sec) {
    if (sec == null) return '';
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m ? `${m} 分 ${s} 秒` : `${s} 秒`;
  }
  const scoreCls = s => s >= 80 ? 's-high' : s >= 60 ? 's-mid' : 's-low';

  function renderScores() {
    const all = selectedStudents();
    const done = all.filter(s => !s.inProgress);
    const scores = done.map(s => s.score);
    const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
    const pass = scores.filter(x => x >= 60).length;
    const sorted = [...scores].sort((a, b) => a - b);
    const median = sorted.length ? (sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2) : null;
    $('kpis').innerHTML = [
      ['已交卷', done.length, all.length > done.length ? `作答中 ${all.length - done.length} 人` : '人', 'sky', '👥'],
      ['平均分數', avg == null ? '—' : (Math.round(avg * 10) / 10), median == null ? '' : `中位數 ${median}`, 'gold', '📈'],
      ['最高分', scores.length ? Math.max(...scores) : '—', '', 'jade', '🏆'],
      ['最低分', scores.length ? Math.min(...scores) : '—', '', 'red', '📉'],
      ['及格率', scores.length ? `${Math.round(pass / scores.length * 100)}%` : '—', scores.length ? `${pass} / ${scores.length} 人` : '', 'jade', '✅']
    ].map(([k, v, sub, c, i]) => `<div class="kpi"><span class="ico ${c}">${i}</span><span>${k}</span><b>${v}</b><small>${sub}</small></div>`).join('');

    const bins = Array(10).fill(0);
    scores.forEach(s => bins[Math.min(9, Math.floor(s / 10))]++);
    const max = Math.max(1, ...bins);
    $('bars').innerHTML = bins.map((n, i) => `<div class="bar-col ${i >= 8 ? 'high' : i >= 6 ? 'pass' : 'fail'}" title="${i * 10}–${i === 9 ? 100 : i * 10 + 9} 分：${n} 人">
      <span class="n">${n || ''}</span><div class="b" style="height:${n / max * 85}%"></div></div>`).join('');
    $('barX').innerHTML = bins.map((_, i) => `<span>${i * 10}${i === 9 ? '+' : ''}</span>`).join('');
    $('chartNote').textContent = scores.length ? '紅：不及格｜金：60–79｜綠：80 以上' : '尚無交卷資料';

    const rows = [...all].sort((x, y) => {
      let a = x[sortKey], b = y[sortKey];
      if (a == null) return 1; if (b == null) return -1;
      if (sortKey === 'className') {
        const c = String(a).localeCompare(String(b), 'zh-Hant', { numeric: true });
        return (c || x.seat - y.seat) * sortDir;
      }
      return (typeof a === 'number' ? a - b : String(a).localeCompare(String(b), 'zh-Hant')) * sortDir;
    });
    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.textContent = th.textContent.replace(/ [▲▼]$/, '') + (th.dataset.sort === sortKey ? (sortDir > 0 ? ' ▲' : ' ▼') : '');
    });
    if (!rows.length) { $('stuBody').innerHTML = '<tr class="detail-row"><td colspan="9"><div class="empty"><div class="big">📭</div>尚無學生作答。</div></td></tr>'; return; }
    const total = R.questions.length;
    $('stuBody').innerHTML = rows.map(s => {
      const key = `${s.className}#${s.seat}`;
      const notes = [];
      if (s.inProgress) notes.push('<span class="flagnote prog">作答中</span>');
      if (s.otherNames.length) notes.push(`<span class="flagnote" title="其他次作答填的作答代號">⚠ 作答代號不一致：${esc(s.otherNames.join('、'))}</span>`);
      if (s.dupName) notes.push('<span class="flagnote">⚠ 同名在其他座號</span>');
      if (s.extraAttempts) notes.push(`<span class="muted">另練習 ${s.extraAttempts} 次</span>`);
      const row = `<tr data-key="${esc(key)}" class="${openStudent === key ? 'open-row' : ''}">
        <td>${esc(s.className)}</td><td class="num">${s.seat}</td><td><b>${esc(s.name)}</b></td>
        <td class="num">${s.score != null ? `<span class="score-badge ${scoreCls(s.score)}">${s.score}</span>` : '—'}</td>
        <td class="num">${s.correctCount != null ? `${s.correctCount} / ${total}` : '—'}</td>
        <td>${MODE_NAME[s.mode]}</td><td>${fmt(s.submittedAt)}</td><td class="num">${fmtDur(s.duration)}</td><td>${notes.join(' ')}</td></tr>`;
      if (openStudent !== key) return row;
      const cells = R.questions.map((q, i) => {
        const c = s.answers[q.id];
        const ok = c === q.answer;
        return `<span class="mini ${c == null ? '' : ok ? 'ok' : 'no'}" title="第 ${i + 1} 題｜作答 ${c == null ? '未答' : L[c]}｜正解 ${L[q.answer]}">${i + 1}．${c == null ? '—' : L[c]}</span>`;
      }).join('');
      return row + `<tr class="detail-row"><td colspan="9"><div class="mini-grid">${cells}</div></td></tr>`;
    }).join('');
  }

  document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'score' || k === 'correctCount' ? -1 : 1; }
    renderScores();
  });
  $('stuBody').onclick = e => {
    const tr = e.target.closest('tr[data-key]');
    if (!tr) return;
    openStudent = openStudent === tr.dataset.key ? null : tr.dataset.key;
    renderScores();
  };

  // ---------- 試卷檢討：與學生題卡同格式 ----------
  function heatColor(rate) {
    const lerp = (a, b, t) => Math.round(a + (b - a) * t);
    const W = [255, 255, 255], Y = [253, 224, 71], Rd = [220, 38, 38];
    const [from, to, t] = rate <= .5 ? [W, Y, rate / .5] : [Y, Rd, (rate - .5) / .5];
    return `rgb(${lerp(from[0], to[0], t)},${lerp(from[1], to[1], t)},${lerp(from[2], to[2], t)})`;
  }
  const heatFg = rate => rate > .62 ? '#fff' : '#1b2a41';

  function itemStats() {
    const done = selectedStudents().filter(s => !s.inProgress);
    return R.questions.map((q, i) => {
      const counts = [0, 0, 0, 0]; let blank = 0;
      done.forEach(s => { const c = s.answers[q.id]; c == null ? blank++ : counts[c]++; });
      const n = done.length;
      const wrong = n - counts[q.answer];
      return { q, i, n, counts, blank, wrong, rate: n ? wrong / n : 0 };
    });
  }

  // 一張檢討題卡；reveal=false 時只顯示題目與選項（先讓學生想）
  function reviewCard(s, { reveal = true, showExp = true } = {}) {
    const { q, i, n, counts, blank } = s;
    const pct = x => n ? Math.round(x / n * 100) : 0;
    const wrongMax = Math.max(0, ...counts.filter((_, k) => k !== q.answer));
    let part = '';
    const opts = q.options.map((o, k) => {
      const isAns = k === q.answer;
      const trap = !isAns && wrongMax > 0 && counts[k] === wrongMax;
      const cls = reveal ? (isAns ? ' correct-answer' : trap ? ' wrong-selected' : '') : '';
      const note = reveal ? (isAns ? '<span class="note" style="color:var(--correct)">✔ 正解</span>' : trap ? '<span class="note" style="color:var(--wrong)">⚠ 最多人誤選</span>' : '') : '';
      return `<div class="opt static${cls}">
        ${reveal ? `<div class="bar" style="--w:${pct(counts[k])}%"></div>` : ''}
        <span class="letter">${L[k]}</span><span>${o}${note}</span>
        ${reveal ? `<span class="cnt">${counts[k]} 人・${pct(counts[k])}%</span>` : ''}
      </div>`;
    }).join('');
    const rate = Math.round(s.rate * 100);
    return `
      <div class="q-head">
        <div><span class="q-num">第 ${i + 1} 題</span><span class="q-tag">${esc(q.tag || '單選題')}</span></div>
        ${n ? `<span class="rate-badge" style="background:${heatColor(s.rate)};color:${heatFg(s.rate)}">答錯率 ${rate}%（${s.wrong}/${n} 人）</span>` : ''}
      </div>
      <div class="q-title">${q.title}</div>
      <div>${opts}</div>
      ${reveal && blank ? `<div class="blank-row">未作答：${blank} 人・${pct(blank)}%</div>` : ''}
      ${showExp && q.explanation ? `<div class="exp"><div class="exp-title">💡 解析</div>${q.explanation}</div>` : ''}`;
  }

  function orderedStats() {
    const st = itemStats();
    return $('itemSort').value === 'rate' ? [...st].sort((a, b) => b.rate - a.rate || a.i - b.i) : st;
  }

  function renderItems() {
    const stats = orderedStats();
    const n = stats[0]?.n || 0;
    $('itemsN').textContent = `｜${n} 位已交卷學生，未答算答錯`;
    $('heatNav').innerHTML = stats.map(s => `<button type="button" class="heat-btn" data-q="${s.q.id}" title="第 ${s.i + 1} 題：答錯 ${s.wrong}/${s.n} 人"
      style="background:${heatColor(s.rate)};color:${heatFg(s.rate)}"><b>${s.i + 1}</b><small>${n ? Math.round(s.rate * 100) + '%' : '—'}</small></button>`).join('');
    if (!n) { $('reviewList').innerHTML = '<div class="empty"><div class="big">📭</div>尚無學生交卷，下面先列出題目。</div>'; }
    $('reviewList').innerHTML = (n ? '' : $('reviewList').innerHTML) +
      stats.map(s => `<article class="card q-card" id="rv-${s.q.id}">${reviewCard(s)}</article>`).join('');
  }
  $('itemSort').onchange = renderItems;
  $('heatNav').onclick = e => {
    const b = e.target.closest('.heat-btn');
    if (b) openStage(Number(b.dataset.q));
  };

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    $('tabScores').classList.toggle('hidden', t.dataset.tab !== 'scores');
    $('tabItems').classList.toggle('hidden', t.dataset.tab !== 'items');
  });

  // ---------- 投影檢討 ----------
  let stIdx = 0, stReveal = true, stExp = false, stList = [];
  function openStage(qid) {
    stList = orderedStats();
    stIdx = Math.max(0, stList.findIndex(s => s.q.id === qid));
    $('stage').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    renderStage();
  }
  function closeStage() {
    $('stage').classList.add('hidden');
    document.body.style.overflow = '';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  $('btnPresent').onclick = () => openStage(orderedStats()[0]?.q.id);
  $('stageClose').onclick = closeStage;
  $('stageFull').onclick = toggleFull;
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else $('stage').requestFullscreen?.().catch(() => toast('瀏覽器不允許全螢幕'));
  }
  function go(d) { if (stList[stIdx + d]) { stIdx += d; renderStage(); } }
  $('stPrev').onclick = () => go(-1);
  $('stNext').onclick = () => go(1);
  $('stAns').onclick = () => { stReveal = !stReveal; renderStage(); };
  $('stExp').onclick = () => { stExp = !stExp; renderStage(); };
  $('stageNav').onclick = e => {
    const b = e.target.closest('button[data-i]');
    if (b) { stIdx = Number(b.dataset.i); renderStage(); }
  };
  document.addEventListener('keydown', e => {
    if ($('stage').classList.contains('hidden')) return;
    if (e.target.closest('input, select, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(-1); e.preventDefault(); }
    else if (e.key === ' ') { stReveal = !stReveal; renderStage(); e.preventDefault(); }
    else if (e.key === 'e' || e.key === 'E') { stExp = !stExp; renderStage(); }
    else if (e.key === 'f' || e.key === 'F') toggleFull();
    else if (e.key === 'Escape' && !document.fullscreenElement) closeStage();
  });

  function renderStage() {
    if (!R || !stList.length) return;
    stList = orderedStats().map(s => s); // 依目前班級篩選重算
    const s = stList[stIdx] || stList[0];
    $('stageTitle').textContent = R.assignment.title + ($('classFilter').value ? `・${$('classFilter').value} 班` : '');
    $('stageNav').innerHTML = stList.map((x, k) => `<button type="button" data-i="${k}" class="${k === stIdx ? 'cur' : ''}"
      style="background:${heatColor(x.rate)};color:${heatFg(x.rate)}" title="第 ${x.i + 1} 題 答錯率 ${Math.round(x.rate * 100)}%">${x.i + 1}</button>`).join('');
    $('stageNav').querySelector('.cur')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    $('stageCard').innerHTML = reviewCard(s, { reveal: stReveal, showExp: stExp });
    $('stPos').textContent = `${stIdx + 1} / ${stList.length}`;
    $('stPrev').disabled = stIdx === 0;
    $('stNext').disabled = stIdx === stList.length - 1;
    $('stAns').classList.toggle('on', stReveal);
    $('stExp').classList.toggle('on', stExp);
    fitStage();
  }

  // 自動縮放：由大往小找出整題放得進畫面的字級（再乘上閱讀設定的倍率）
  function fitStage() {
    const body = $('stageBody'), card = $('stageCard');
    const scale = (parseFloat(document.documentElement.style.fontSize) || 100) / 100;
    let hi = Math.min(64, Math.max(18, Math.min(innerWidth / 30, innerHeight / 17) * scale)), lo = 12;
    const fits = f => { card.style.setProperty('--fit', f); return card.scrollHeight <= body.clientHeight - 8 && card.scrollWidth <= body.clientWidth; };
    if (fits(hi)) return;
    for (let k = 0; k < 8; k++) { const mid = (hi + lo) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    card.style.setProperty('--fit', lo);
  }
  addEventListener('resize', () => { if (!$('stage').classList.contains('hidden')) fitStage(); });
  document.addEventListener('fullscreenchange', () => setTimeout(fitStage, 60));
  new MutationObserver(() => { if (!$('stage').classList.contains('hidden')) fitStage(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'data-font'] });

  // ---------- CSV ----------
  $('btnCsv').onclick = () => {
    if (!R) return;
    const qs = R.questions;
    const head = ['班級', '座號', '作答代號', '分數', '答對題數', '模式', '交卷時間', '用時(秒)', '狀態', ...qs.map((_, i) => `第${i + 1}題`)];
    const lines = [head, ['', '', '', '', '', '', '', '', '正確答案', ...qs.map(q => L[q.answer])]];
    [...selectedStudents()].sort((x, y) => String(x.className).localeCompare(String(y.className), 'zh-Hant', { numeric: true }) || x.seat - y.seat)
      .forEach(s => lines.push([s.className, s.seat, s.name, s.score ?? '', s.correctCount ?? '', MODE_NAME[s.mode], fmt(s.submittedAt),
        s.duration == null ? '' : Math.round(s.duration), s.inProgress ? '作答中' : '已交卷',
        ...qs.map(q => s.answers[q.id] == null ? '' : L[s.answers[q.id]])]));
    const csv = '﻿' + lines.map(r => r.map(v => {
      let x = String(v ?? '');
      if (/^[=+\-@]/.test(x)) x = "'" + x;
      return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x;
    }).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `${R.assignment.title}-${R.assignment.code}${$('classFilter').value ? '-' + $('classFilter').value : ''}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  token ? openList() : show('loginCard');
})();
</script>
</body>
</html>
